<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Duck Everything</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="popup-wide.css">
</head>
<body>
  <!-- ════════ MAIN VIEW ════════ -->
  <div id="view-main" class="view active">
    <header>
      <div class="header-left">
        <img src="icon.svg" alt="" class="header-icon">
        <h1>Duck Everything</h1>
      </div>
    </header>

    <div class="separator">
      <span class="sep-label">captura</span>
    </div>

    <div class="capture-actions">
      <button id="capture" class="capture" title="Escolher onde salvar o PNG da área visível">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span class="when-compact">Salvar PNG</span><span class="when-wide">Salvar PNG como</span>
      </button>
      <button id="capture-quick" class="capture accent" title="Salvar PNG direto na pasta padrão de downloads">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        PNG rápido
      </button>
      <label class="copy-toggle" title="Além de salvar o arquivo, deixa o print na área de transferência para colar com Ctrl+V.">
        <input type="checkbox" id="capture-copy" role="switch">
        <i class="switch"></i>
        <span>Copiar também para o Ctrl+V</span>
      </label>
    </div>

    <div class="separator">
      <span class="sep-label">opções</span>
    </div>

    <section class="options-list">
      <label class="row" title="Área de transferência. O site continua vendo o evento, mas não consegue cancelar a cópia, o recorte nem a colagem (útil em campos de resposta). Em editores ricos o site pode perder recursos próprios de colar (ex.: imagem).">
        <span class="row-text">
          <b>Copiar, recortar e colar</b>
          <small>Impede o site de bloquear Ctrl+C, Ctrl+X, Ctrl+V e os menus copiar/colar.</small>
        </span>
        <input type="checkbox" id="clipboard" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Mouse. O site deixa de receber o evento de menu de contexto. Menus próprios do site (Drive, Figma) não abrem.">
        <span class="row-text">
          <b>Botão direito</b>
          <small>Mantém o menu do navegador, mesmo que o site tente bloqueá-lo.</small>
        </span>
        <input type="checkbox" id="context" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Mouse. Força seleção de texto e libera o arrastar de texto, imagens e links. Itens arrastáveis do próprio site (listas, kanban) continuam funcionando.">
        <span class="row-text">
          <b>Selecionar e arrastar</b>
          <small>Deixa marcar texto e arrastar imagens/links onde o site proíbe.</small>
        </span>
        <input type="checkbox" id="selection" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Teclado. Atalhos do navegador voltam a funcionar. Ctrl+C/X/V são controlados pela opção de copiar e colar.">
        <span class="row-text">
          <b>Atalhos do teclado</b>
          <small>Impede o site de bloquear F5, F11, F12, Esc, Ctrl+R/U/I e os atalhos do DevTools.</small>
        </span>
        <input type="checkbox" id="shortcuts" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Teclado. Esconde do site WASD, Alt, setas, atalhos… Digitar e apertar Enter dentro de campos de texto continua normal (e, lá dentro, o site ainda vê o que você digita). Apps com atalhos de teclado e jogos deixam de responder.">
        <span class="row-text">
          <b>Esconder teclas</b>
          <small>O site não vê as teclas que você aperta fora de campos de texto.</small>
        </span>
        <input type="checkbox" id="keys" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Tela. Responde &quot;sucesso&quot; ao pedido de tela cheia sem ampliar nada. Botões de tela cheia de players de vídeo deixam de ampliar.">
        <span class="row-text">
          <b>Antifullscreen</b>
          <small>O site acha que está em tela cheia, mas a janela não muda.</small>
        </span>
        <input type="checkbox" id="fullscreen" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Tela. Trocar de aba ou janela não é detectado pelo site (visibilityState, hasFocus, blur e focus da janela). O foco entre botões e campos continua normal.">
        <span class="row-text">
          <b>Simular foco e visibilidade</b>
          <small>O site sempre vê a aba como visível e em foco.</small>
        </span>
        <input type="checkbox" id="focus" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Tela. Nega Keyboard Lock e Pointer Lock. Jogos e visualizadores 3D que usam o mouse travado podem parar.">
        <span class="row-text">
          <b>Negar trava de teclado e mouse</b>
          <small>O site não consegue prender o teclado ou o ponteiro.</small>
        </span>
        <input type="checkbox" id="locks" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Navegação. Só ignora o site &quot;re-empurrando&quot; o histórico depois de Voltar. Raramente necessário; deixe desligado se o Voltar já funciona.">
        <span class="row-text">
          <b>Armadilha do botão Voltar</b>
          <small>Impede o site de te manter preso ao clicar em Voltar.</small>
        </span>
        <input type="checkbox" id="history" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Avisos. Pop-ups de alert() não aparecem nem travam a página.">
        <span class="row-text">
          <b>Silenciar alertas JavaScript</b>
          <small>Silencia alert(); confirm() e prompt() continuam.</small>
        </span>
        <input type="checkbox" id="alerts" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Avançado. Esconde do site o botão direito/meio e as teclas protegidas (F5, F12, Esc, Ctrl/Meta e Ctrl+C/X/V/R/U/I), até dentro de campos de texto. Letras comuns só somem com "Esconder teclas". Não libera nada sozinho: serve para sites que punem ou detectam. Cliques normais e digitação não são afetados.">
        <span class="row-text">
          <b>Modo Absolute</b>
          <small>Esconde do site o botão direito/meio e teclas como F5, F12, Ctrl+C.</small>
        </span>
        <input type="checkbox" id="absolute" role="switch">
        <i class="switch"></i>
      </label>
      <label class="row" title="Site específico. Só age em scribd.com.">
        <span class="row-text">
          <b>Cópia limpa no Scribd</b>
          <small>Copia texto puro e legível em scribd.com.</small>
        </span>
        <input type="checkbox" id="scribd" role="switch">
        <i class="switch"></i>
      </label>
    </section>

    <!-- Bottom fixed area -->
    <div class="bottom-area">
      <div class="separator thin"></div>

      <p id="status" role="status">Carregando…</p>

      <div class="buttons">
        <button id="save" class="btn-secondary">Salvar</button>
        <button id="reload" class="btn-primary">Salvar e recarregar aba</button>
      </div>

      <div class="bulk-actions">
        <button id="reset" class="subtle">Restaurar padrão</button>
        <button id="disable-all" class="subtle">Desativar todas as opções</button>
      </div>

      <footer>
        <div class="separator thin"></div>
        <div class="footer-bar">
          <span class="footer-url" id="footer-url">—</span>
          <span class="page-state" id="page-state" role="status"></span>
          <div class="footer-icons">
            <button id="btn-settings-footer" class="icon-btn-gear" title="Configurações">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <!-- ════════ SETTINGS VIEW ════════ -->
  <div id="view-settings" class="view">
    <header>
      <div class="header-left">
        <button id="btn-back" class="icon-btn" title="Voltar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </button>
        <h1>Configurações</h1>
      </div>
    </header>

    <div class="separator">
      <span class="sep-label">aparência</span>
    </div>

    <div class="settings-section">
      <div class="setting-item">
        <div class="setting-info">
          <b>Cor de destaque</b>
          <small>Escolha uma cor para personalizar a interface, ou use a cor padrão do sistema.</small>
        </div>
        <div class="color-controls">
          <label class="color-system-row">
            <input type="checkbox" id="use-system-color" checked>
            <span>Usar cor do sistema</span>
          </label>
          <div class="color-picker-row" id="custom-color-row">
            <div class="color-preview" id="color-preview"></div>
            <input type="color" id="accent-color" value="#7c6ee7">
            <span class="color-hex" id="color-hex">#7c6ee7</span>
          </div>
          <div class="color-presets" id="color-presets">
            <button class="preset" data-color="#7c6ee7" title="Roxo" style="background:#7c6ee7"></button>
            <button class="preset" data-color="#e06c75" title="Vermelho" style="background:#e06c75"></button>
            <button class="preset" data-color="#98c379" title="Verde" style="background:#98c379"></button>
            <button class="preset" data-color="#e5c07b" title="Amarelo" style="background:#e5c07b"></button>
            <button class="preset" data-color="#61afef" title="Azul" style="background:#61afef"></button>
            <button class="preset" data-color="#c678dd" title="Magenta" style="background:#c678dd"></button>
            <button class="preset" data-color="#56b6c2" title="Ciano" style="background:#56b6c2"></button>
            <button class="preset" data-color="#f5c518" title="Duck Yellow" style="background:#f5c518"></button>
          </div>
        </div>
      </div>
    </div>

<div class="separator">
  <span class="sep-label">interface</span>
</div>

<div class="settings-section">
  <div class="layout-picker">
    <button class="layout-opt" data-layout="compact" aria-pressed="true">
      <svg viewBox="0 0 120 54" aria-hidden="true">
        <rect class="thumb-bg" x="38" y="1" width="44" height="52" rx="4"/>
        <rect class="thumb-main" x="42" y="6" width="36" height="8" rx="2"/>
        <rect class="thumb-line" x="42" y="18" width="36" height="5" rx="2"/>
        <rect class="thumb-line" x="42" y="26" width="36" height="5" rx="2"/>
        <rect class="thumb-line" x="42" y="34" width="36" height="5" rx="2"/>
        <rect class="thumb-line" x="42" y="42" width="36" height="5" rx="2"/>
      </svg>
      <span><b>Padrão</b><small>Lista compacta, como é hoje.</small></span>
    </button>
    <button class="layout-opt" data-layout="wide" aria-pressed="false">
      <svg viewBox="0 0 120 54" aria-hidden="true">
        <rect class="thumb-bg" x="1" y="1" width="118" height="52" rx="4"/>
        <rect class="thumb-main" x="6" y="6" width="26" height="42" rx="3"/>
        <rect class="thumb-line" x="37" y="6" width="23" height="12" rx="2"/>
        <rect class="thumb-line" x="63" y="6" width="23" height="12" rx="2"/>
        <rect class="thumb-line" x="89" y="6" width="25" height="12" rx="2"/>
        <rect class="thumb-line" x="37" y="21" width="23" height="12" rx="2"/>
        <rect class="thumb-line" x="63" y="21" width="23" height="12" rx="2"/>
        <rect class="thumb-line" x="89" y="21" width="25" height="12" rx="2"/>
        <rect class="thumb-line" x="37" y="36" width="23" height="12" rx="2"/>
        <rect class="thumb-line" x="63" y="36" width="23" height="12" rx="2"/>
      </svg>
      <span><b>Ampliado em blocos</b><small>Mais largo, opções lado a lado.</small></span>
    </button>
  </div>
</div>

    <div class="separator">
      <span class="sep-label">sobre</span>
    </div>

    <div class="settings-section">
      <div class="info-row">
        <span>Autor</span>
        <span class="info-value">uniedit</span>
      </div>
      <div class="info-row">
        <span>Laboratório de testes</span>
        <a class="info-value" href="http://127.0.0.1:8765" target="_blank" rel="noopener" title="Abra iniciar-windows.bat (ou python serve.py) antes">127.0.0.1:8765</a>
      </div>
    </div>
  </div>

  <script src="browser-shim.js"></script>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
