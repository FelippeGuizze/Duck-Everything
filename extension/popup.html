<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Graphite Control</title><link rel="stylesheet" href="popup.css"><body><header><h1>Graphite Control</h1></header><main><label class="row master"><span><b>Ativar globalmente</b><small>Preferências para todos os sites permitidos</small></span><input type="checkbox" id="enabled" role="switch"><i></i></label><div class="capture-actions"><button id="capture" class="capture" title="Escolher onde salvar o PNG da área visível">Salvar PNG…</button><button id="capture-quick" class="capture" title="Salvar PNG direto na pasta padrão de downloads, sem escolher local">PNG rápido</button></div><p class="note">Opções — role a lista para ver todas</p><section><label class="row"><span><b>Copiar e recortar</b><small>Preserva a cópia e o recorte nativos.</small></span><input type="checkbox" id="copy" role="switch"><i></i></label><label class="row"><span><b>Colar</b><small>Libera eventos de colagem.</small></span><input type="checkbox" id="paste" role="switch"><i></i></label><label class="row"><span><b>Botão direito</b><small>Restaura o menu do navegador.</small></span><input type="checkbox" id="context" role="switch"><i></i></label><label class="row"><span><b>Selecionar e arrastar</b><small>Força seleção de texto por CSS.</small></span><input type="checkbox" id="selection" role="switch"><i></i></label><label class="row"><span><b>Modo Absolute</b><small>Interceptação forte; pode afetar sites interativos.</small></span><input type="checkbox" id="absolute" role="switch"><i></i></label><label class="row"><span><b>Atalhos do teclado</b><small>Libera F5, F11, F12, Esc e atalhos Ctrl/Cmd.</small></span><input type="checkbox" id="shortcuts" role="switch"><i></i></label><label class="row"><span><b>Antifullscreen</b><small>Simula sucesso sem ampliar a janela.</small></span><input type="checkbox" id="fullscreen" role="switch"><i></i></label><label class="row"><span><b>Simular foco e visibilidade</b><small>Informa página visível e com foco.</small></span><input type="checkbox" id="focus" role="switch"><i></i></label><label class="row"><span><b>Liberar botão Voltar</b><small>Impede handlers de popstate da página.</small></span><input type="checkbox" id="history" role="switch"><i></i></label><label class="row"><span><b>Bloquear captura de teclado/mouse</b><small>Nega Keyboard Lock e Pointer Lock.</small></span><input type="checkbox" id="locks" role="switch"><i></i></label><label class="row"><span><b>Silenciar alertas JavaScript</b><small>Silencia alert(); mantém confirm() e prompt().</small></span><input type="checkbox" id="alerts" role="switch"><i></i></label></section><p class="note">Absolute pode afetar teclado, editores e arraste. Desative-o se um site parar de responder.</p><p id="status" role="status">Carregando…</p><div class="buttons"><button id="save">Salvar</button><button id="reload">Salvar e recarregar aba</button></div><div class="bulk-actions"><button id="reset" class="subtle">Ativar todas as opções</button><button id="disable-all" class="subtle">Desativar todas as opções</button></div></main><script src="defaults.js"></script><script src="popup.js"></script></body></html>
